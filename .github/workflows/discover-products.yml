name: Find products

# Searches every seller's catalogue for a term and prints what it finds, with
# URLs. Use it when adding a new oil to the index -- the product URLs carry
# site-specific codes and cannot be guessed.
#
# This only reports. It never writes to the index.

on:
  workflow_dispatch:
    inputs:
      term:
        description: "What to search for (e.g. palm, sunflower, coconut)"
        required: true
        default: "palm"
      sellers:
        description: "Limit to these sellers, comma-separated. Blank = all."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Search the catalogues
        run: |
          python scripts/discover.py \
            --term "${{ inputs.term }}" \
            --only "${{ inputs.sellers }}" \
            --json discovered.json

      - name: Keep the results as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-${{ inputs.term }}
          path: discovered.json
          if-no-files-found: ignore
