name: Daily oil prices

# Collects the tracked SKUs once a day and commits the rebuilt index.
#
# Split deliberately into two collectors so one failing never stops the other:
#
#   collect-cloud     GitHub's runners  -> JJ, Brakes, Marfast, Magna  (11 SKUs)
#   collect-booker    self-hosted runner -> Booker only        (4 SKUs)
#
# Booker blocks datacenter IPs at its CDN edge, so it can ONLY be read from a
# machine on a normal (residential/business) connection. See ARCHITECTURE.md §11
# and HANDOVER.md §3.
#
# collect-booker is OFF until you set the repository variable BOOKER_RUNNER=true.
# Until then the index publishes the four cloud sellers, Booker's last price carries
# forward for 7 days, and then Booker lapses out of the average rather than sitting
# frozen. Once the runner is installed and the variable set, it rejoins by itself.
#
# Any failure opens a GitHub issue, so a silent death is impossible.

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  collect-cloud:
    runs-on: ubuntu-latest
    # A hung page must not hold the runner for hours -- a slow seller should cost
    # us that seller's prices for a day, nothing more. Carry-forward covers the gap.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect (all sellers except Booker)
        timeout-minutes: 15
        run: python3 scripts/adapters.py --run --write --exclude "Booker"
      - uses: actions/upload-artifact@v4
        with:
          name: obs-cloud
          path: data/observations.csv

  collect-booker:
    # Runs ONLY once the self-hosted runner exists. Set the repository variable
    # BOOKER_RUNNER to "true" when you install it (HANDOVER.md §3).
    #
    # Why a variable and not just "try it and let it fail": a job whose runner label
    # matches nothing does not fail, it QUEUES -- for up to 24 hours. `continue-on-
    # error` never applies, because the job never starts, and `timeout-minutes` only
    # counts once it does. Since build-and-commit needs this job, the entire index
    # would stop publishing until the queue expired, every single day. A skipped job
    # satisfies `needs` immediately, so with the variable unset the pipeline simply
    # publishes the four cloud sellers and carries on.
    if: vars.BOOKER_RUNNER == 'true'
    runs-on: self-hosted
    # Never block the pipeline: if the runner is offline or Booker changes, the
    # rest of the index still updates.
    continue-on-error: true
    # Generous: the first run on a new machine also installs Python and Chromium.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: Collect Booker only
        # `python`, not `python3` -- this job runs on a self-hosted Windows box,
        # where no `python3` executable exists. setup-python provides `python` on
        # every platform, so this stays correct if the runner is ever moved.
        run: python scripts/adapters.py --run --write --only "Booker"
      - uses: actions/upload-artifact@v4
        with:
          name: obs-booker
          path: data/observations.csv

  build-and-commit:
    needs: [collect-cloud, collect-booker]
    if: always() && needs.collect-cloud.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: incoming
        continue-on-error: true

      - name: Merge collector outputs
        run: |
          python3 - <<'PY'
          import csv, glob, os
          FIELDS = ["date","oil","brand","format","channel","source","product","url",
                    "pack_value","pack_unit","price_gbp","notes"]
          rows, seen = [], set()
          # repo copy first, then each collector's file; later wins per (date,source,product)
          paths = ["data/observations.csv"] + sorted(glob.glob("incoming/*/observations.csv"))
          merged = {}
          order = []
          for p in paths:
              if not os.path.exists(p):
                  continue
              with open(p, encoding="utf-8") as fh:
                  for r in csv.DictReader(fh):
                      k = (r["date"], r["source"], r["product"])
                      if k not in merged:
                          order.append(k)
                      merged[k] = r
              print(f"read {p}")
          out = [merged[k] for k in order]
          out.sort(key=lambda r: (r["date"], r["oil"], r["source"], r["format"]))
          with open("data/observations.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.DictWriter(fh, fieldnames=FIELDS); w.writeheader(); w.writerows(out)
          print(f"merged -> {len(out)} rows")
          PY

      - name: Rebuild index
        run: |
          python3 scripts/process.py
          python3 scripts/render_static.py

      # Writes SUMMARY.md every day (GitHub renders it in the repo, so the index is
      # readable on a phone without cloning). Writes report.md ONLY when a price
      # actually moved, or on the Monday digest -- that file's existence is what
      # decides whether anyone gets emailed below.
      - name: Build summary, and a report if there is something to say
        id: summary
        run: python3 scripts/render_summary.py --report-out report.md

      - name: Commit
        run: |
          git config user.name  "oil-price-bot"
          git config user.email "actions@github.com"
          git add data/observations.csv data/series.js data/series.json \
                  dashboard_static.html SUMMARY.md
          if git diff --cached --quiet; then
            echo "No price changes today."
          else
            git commit -m "Daily oil prices: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Posted as a comment on one long-running issue, so GitHub emails everyone
      # watching the repo. Deliberately silent on days nothing moved: a summary that
      # arrives every morning saying "no change" gets filtered, and then the morning
      # that matters gets filtered with it.
      - name: Notify watchers (only when prices moved, or the weekly digest)
        if: steps.summary.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "📈 Cooking oil price reports"
        run: |
          set -euo pipefail
          # List and filter locally rather than using --search: GitHub's search index
          # is eventually consistent, so a freshly-opened thread can be invisible to
          # search for minutes, which would open a second thread the next morning.
          issue=$(gh issue list --state open --limit 100 --json number,title \
                    --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -z "$issue" ]; then
            url=$(gh issue create --title "$TITLE" --body-file report.md)
            echo "Opened the report thread: $url"
          else
            gh issue comment "$issue" --body-file report.md
            echo "Commented on report thread #$issue"
          fi

  alert-on-failure:
    needs: [collect-cloud, collect-booker, build-and-commit]
    # Booker is allowed to be 'skipped' (no self-hosted runner configured yet) --
    # only a genuine failure counts. Without the skipped exclusion this would open a
    # "collection problem" issue every single day, which is how real alerts get
    # ignored.
    if: >-
      always() && (
        needs.collect-cloud.result != 'success' ||
        needs.build-and-commit.result != 'success' ||
        (needs.collect-booker.result != 'success' && needs.collect-booker.result != 'skipped')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue so the failure is visible
        uses: actions/github-script@v7
        with:
          script: |
            const r = {
              cloud: '${{ needs.collect-cloud.result }}',
              booker: '${{ needs.collect-booker.result }}',
              build: '${{ needs.build-and-commit.result }}',
            };
            const today = new Date().toISOString().slice(0,10);
            const title = `Daily price collection problem — ${today}`;
            const body = [
              'The daily collection did not complete cleanly.',
              '',
              `- collect-cloud (JJ, Brakes, Marfast, Magna): **${r.cloud}**`,
              `- collect-booker (self-hosted runner): **${r.booker}**`,
              `- build-and-commit: **${r.build}**`,
              '',
              `[View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'Most likely causes, in order:',
              '1. **collect-booker failed** — the self-hosted runner is offline or the',
              '   machine is switched off. Booker carries its last price forward, so the',
              '   index is still correct, just staler. See HANDOVER.md.',
              '2. **A seller changed their page** — the adapter can no longer find a',
              '   labelled price. Run the "Test adapters" workflow with diagnostics.',
              '3. **A seller started blocking us** — check for 403 / "Access Denied".',
              '',
              'No bad data is ever written: a price is only recorded from a labelled',
              'source, so a failure means missing data, never wrong data.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'collection-failure',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already open for today.');
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['collection-failure'],
              });
            }
