name: Test email

# Sends a sample price report, on demand, so email can be proved to work without
# waiting for a seller to move a price.
#
#   Actions -> Test email -> Run workflow
#
# Needs the SMTP secrets from HANDOVER.md section 4a. If any are missing this
# reports which ones and exits green without sending.
#
# Nothing is committed. The price-move sample is generated from a throwaway copy of
# the data inside the runner, so the real index is untouched.

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Send to this address instead of the REPORT_TO secret (optional)"
        required: false
        default: ""
      kind:
        description: "Which sample to send"
        required: false
        default: "both"
        type: choice
        options: [both, digest, price-move]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_FROM: ${{ secrets.REPORT_FROM }}
      # An explicit recipient wins over the stored list, so a test never surprises
      # the whole distribution list.
      REPORT_TO: ${{ inputs.to != '' && inputs.to || secrets.REPORT_TO }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Names only -- never values. Tells you which secret is missing without
      # printing any of them.
      #
      # This FAILS when a required setting is absent. The daily workflow deliberately
      # stays green when email is unconfigured, so nothing breaks for anyone who
      # never wants it -- but a workflow whose only job is to test email must not
      # report success having sent nothing.
      - name: Check the settings are present
        run: |
          missing=""
          for n in SMTP_HOST SMTP_USER SMTP_PASSWORD REPORT_TO; do
            if [ -n "${!n}" ]; then echo "  $n: set"; else echo "  $n: MISSING"; missing="$missing $n"; fi
          done
          for n in SMTP_PORT REPORT_FROM; do
            if [ -n "${!n}" ]; then echo "  $n: set"; else echo "  $n: not set (optional)"; fi
          done
          if [ -n "$missing" ]; then
            echo ""
            echo "::error::Cannot send: missing$missing. REPORT_TO alone is only the"
            echo "::error::recipient list -- sending also needs a mailbox to send THROUGH."
            echo "::error::Add them under Settings -> Secrets and variables -> Actions."
            echo "::error::See HANDOVER.md section 4a."
            exit 1
          fi

      - name: Send the weekly digest sample
        if: env.KIND == 'both' || env.KIND == 'digest'
        run: |
          python3 scripts/process.py > /dev/null
          python3 scripts/render_summary.py \
            --report-out r.md --report-html r.html --force-report
          [ -f r.html ] || { echo "::error::No sample generated."; exit 1; }
          python3 scripts/send_report.py --html r.html --text r.md \
            --subject "[SAMPLE] Cooking oil prices - weekly digest"

      # Simulated movement, written to the runner's copy only. Two sellers cutting
      # and one raising, which is what a real day of movement tends to look like.
      - name: Send the price-move sample
        if: env.KIND == 'both' || env.KIND == 'price-move'
        run: |
          python3 - <<'PY'
          import csv, datetime
          rows = list(csv.DictReader(open("data/observations.csv")))
          hdr = list(rows[0].keys())
          # The day AFTER the latest real observation. Hardcoding a date meant that
          # once the real collection reached it, the fake rows collided with real
          # ones, the comparison found no movement, and the sample silently vanished.
          latest = max(r["date"] for r in rows)
          nxt = (datetime.date.fromisoformat(latest) + datetime.timedelta(days=1)).isoformat()
          newest = [r for r in rows if r["date"] == latest]
          out = list(rows)
          for r in newest:
              n = dict(r)
              n["date"] = nxt
              p = float(r["price_gbp"])
              if   r["source"] == "Magna Foodservice": n["price_gbp"] = f"{p - 1.50:.2f}"
              elif r["source"] == "Marfast":           n["price_gbp"] = f"{p - 0.75:.2f}"
              elif r["source"] == "JJ Foodservice":    n["price_gbp"] = f"{p + 0.40:.2f}"
              out.append(n)
          w = csv.DictWriter(open("data/observations.csv", "w", newline=""), fieldnames=hdr)
          w.writeheader(); w.writerows(out)
          print(f"simulated movement on {nxt} (runner copy only)")
          PY
          python3 scripts/process.py > /dev/null
          python3 scripts/render_summary.py --report-out r.md --report-html r.html
          # A test that reports success having sent nothing is worse than useless.
          if [ ! -f r.html ]; then
            echo "::error::The simulation produced no movement, so no sample was sent."
            exit 1
          fi
          python3 scripts/send_report.py --html r.html --text r.md \
            --subject "[SAMPLE] Cooking oil prices moved"

      - name: Confirm nothing was committed
        run: git status --short && echo "(runner copy only -- the repo is untouched)"
