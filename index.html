<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cash &amp; Carry Cooking Oil Price Proxy</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1c1c1e;
    --muted: #6b6b70;
    --line: #e3e3e0;
    --grid: #ececea;
    --accent: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1f2126;
      --ink: #f2f2f4;
      --muted: #9a9ba1;
      --line: #2e3138;
      --grid: #262930;
      --accent: #f2f2f4;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1c1e; --muted: #6b6b70;
    --line: #e3e3e0; --grid: #ececea; --accent: #1c1c1e;
  }
  :root[data-theme="dark"] {
    --bg: #16171a; --panel: #1f2126; --ink: #f2f2f4; --muted: #9a9ba1;
    --line: #2e3138; --grid: #262930; --accent: #f2f2f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-top: 18px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .control-group { display: flex; flex-direction: column; gap: 7px; }
  .control-group .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink);
    padding: 7px 13px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  [hidden] { display: none !important; }
  .chart-wrap { position: relative; margin-top: 6px; }
  #chartHost svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; font-size: 13px;
    background: var(--panel); transition: opacity .15s;
  }
  .chip[aria-pressed="false"] { opacity: 0.4; }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--accent); color: var(--bg); padding: 8px 10px; border-radius: 8px;
    font-size: 12px; line-height: 1.45; max-width: 240px; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .tip b { font-weight: 600; }
  .foot { color: var(--muted); font-size: 12.5px; margin-top: 16px; }
  .foot a { color: inherit; }
  .banner {
    font-size: 12.5px; color: var(--muted); margin-top: 10px; padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: 9px;
  }
  table.src { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  table.src th, table.src td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.src th { color: var(--muted); font-weight: 500; }
  .detail { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .detail .dhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; margin-bottom: 8px; }
  table.dtab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.dtab th, table.dtab td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.dtab th { color: var(--muted); font-weight: 500; }
  table.dtab tr.ex td { opacity: .5; text-decoration: line-through; }
  table.dtab .fl { color: var(--muted); }
  .themebtn { float: right; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="themebtn" id="themeToggle" title="Toggle theme">◐ theme</button>
    <h1>Cash &amp; Carry Cooking Oil Price Proxy</h1>
    <p>UK B2B index &mdash; single-source oils &amp; refined fats, aggregated across reliable cash-and-carry sellers. Tap a point for the full per-SKU price list. No blends, no supermarket retail.</p>
  </header>

  <div class="card">
    <div class="controls">
      <div class="control-group">
        <span class="lbl">Units</span>
        <div class="seg" id="unitSeg">
          <button data-v="price_per_unit" aria-pressed="true">£ / unit</button>
          <button data-v="price_per_tonne" aria-pressed="false">£ / metric tonne</button>
        </div>
      </div>
      <div class="control-group" id="chanGroup" hidden>
        <span class="lbl">Channel</span>
        <div class="seg" id="chanSeg"></div>
      </div>
    </div>

    <div class="chart-wrap">
      <div id="chartHost"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="banner" id="banner"></div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="card">
    <div class="lbl" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Standard unit per oil</div>
    <table class="src" id="unitTable"></table>
    <p class="foot" id="foot"></p>
  </div>
</div>

<script src="data/series.js"></script>
<script>
(function () {
  const DATA = window.OIL_SERIES;
  if (!DATA) { document.body.innerHTML = "<p style='padding:40px'>No data. Run <code>python3 scripts/process.py</code> first.</p>"; return; }

  const CHANNEL_LABEL = { cash_carry: "Cash & carry", retail: "Retail" };
  const state = {
    unit: "price_per_unit",
    channel: "cash_carry",
    off: new Set(),          // oil keys switched off
  };

  // ---- theme toggle -------------------------------------------------------
  document.getElementById("themeToggle").addEventListener("click", () => {
    const root = document.documentElement;
    const cur = root.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    draw();
  });

  // ---- which oils have data for the current channel -----------------------
  function activeChannels() {
    return state.channel === "both" ? ["cash_carry", "retail"] : [state.channel];
  }
  // A "series" = one oil in one channel.
  function buildSeries() {
    const out = [];
    for (const [oil, o] of Object.entries(DATA.oils)) {
      if (state.off.has(oil)) continue;
      for (const ch of activeChannels()) {
        const pts = (o.channels && o.channels[ch]) || [];
        if (!pts.length) continue;
        out.push({
          key: oil + "|" + ch, oil, ch,
          label: o.label + (state.channel === "both" ? " · " + CHANNEL_LABEL[ch] : ""),
          color: o.color,
          dashed: ch === "retail" && state.channel === "both",
          points: pts.map(p => ({
            date: p.date, t: Date.parse(p.date),
            v: p[state.unit], n_used: p.n_used, n_obs: p.n_obs,
            n_excluded: p.n_excluded, sources: p.sources,
          })),
        });
      }
    }
    return out;
  }

  // ---- legend -------------------------------------------------------------
  const legendEl = document.getElementById("legend");
  function renderLegend() {
    legendEl.innerHTML = "";
    for (const [oil, o] of Object.entries(DATA.oils)) {
      const on = !state.off.has(oil);
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.setAttribute("aria-pressed", on ? "true" : "false");
      chip.innerHTML = `<span class="dot" style="background:${o.color}"></span>${o.label}`;
      chip.addEventListener("click", () => {
        if (state.off.has(oil)) state.off.delete(oil); else state.off.add(oil);
        renderLegend(); draw();
      });
      legendEl.appendChild(chip);
    }
  }

  // ---- segmented controls -------------------------------------------------
  function wireSeg(id, key, after) {
    const seg = document.getElementById(id);
    seg.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        state[key] = btn.dataset.v;
        if (after) after();
        draw();
      });
    });
  }
  wireSeg("unitSeg", "unit");

  // ---- channel control (only shown when >1 channel has data) --------------
  function renderChannels() {
    const present = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.keys(o.channels || {}).forEach(ch => present.add(ch)));
    const order = ["cash_carry", "retail"].filter(ch => present.has(ch));
    state.channel = order[0] || "cash_carry";

    const group = document.getElementById("chanGroup");
    const seg = document.getElementById("chanSeg");
    if (order.length <= 1) { group.hidden = true; return; }  // B2B-only: nothing to switch
    group.hidden = false;
    seg.innerHTML = "";
    const opts = [...order.map(ch => [ch, CHANNEL_LABEL[ch]]), ["both", "Both"]];
    opts.forEach(([v, label], i) => {
      const b = document.createElement("button");
      b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        state.channel = v; updateBanner(); draw();
      });
      seg.appendChild(b);
    });
  }

  // ---- chart (inline SVG: renders from a fixed viewBox, no canvas sizing) --
  const host = document.getElementById("chartHost");
  const tip = document.getElementById("tip");

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function fmtMoney(v) {
    return "£" + v.toLocaleString("en-GB", { minimumFractionDigits: v < 100 ? 2 : 0, maximumFractionDigits: v < 100 ? 2 : 0 });
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  const VW = 1000, VH = 440, pad = { l: 86, r: 30, t: 20, b: 48 };
  const plotW = VW - pad.l - pad.r, plotH = VH - pad.t - pad.b;
  const DAY = 86400000;

  function draw() {
    const series = buildSeries();
    const muted = css("--muted"), grid = css("--grid"), panel = css("--panel");

    // Single-point series -> flat line back to the previous day so it's visible.
    series.forEach(s => {
      s.linePts = (s.points.length === 1)
        ? [{ t: s.points[0].t - DAY, v: s.points[0].v }, s.points[0]]
        : s.points;
    });

    let vals = [], times = [];
    series.forEach(s => s.linePts.forEach(p => { vals.push(p.v); times.push(p.t); }));

    const head = `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">`;
    if (!vals.length) {
      host.innerHTML = head + `<text x="${VW / 2}" y="${VH / 2}" fill="${muted}" font-size="15" text-anchor="middle">No series selected.</text></svg>`;
      return;
    }

    let vmin = Math.min(...vals), vmax = Math.max(...vals);
    if (vmin === vmax) { vmin *= 0.9; vmax *= 1.1; }
    const vpad = (vmax - vmin) * 0.12; vmin = Math.max(0, vmin - vpad); vmax += vpad;
    let tmin = Math.min(...times), tmax = Math.max(...times);
    if (tmin === tmax) { tmin -= DAY; tmax += DAY; }

    const X = t => (pad.l + plotW * (t - tmin) / (tmax - tmin));
    const Y = v => (pad.t + plotH * (1 - (v - vmin) / (vmax - vmin)));

    let svg = head;
    // y grid + labels
    const ticks = 5;
    for (let i = 0; i <= ticks; i++) {
      const v = vmin + (vmax - vmin) * i / ticks, y = Y(v).toFixed(1);
      svg += `<line x1="${pad.l}" y1="${y}" x2="${VW - pad.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
      svg += `<text x="${pad.l - 10}" y="${y}" fill="${muted}" font-size="13" text-anchor="end" dominant-baseline="middle">${esc(fmtMoney(v))}</text>`;
    }
    // x labels (dates)
    [...new Set(times)].sort((a, b) => a - b).forEach(t => {
      const lab = new Date(t).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit" });
      svg += `<text x="${X(t).toFixed(1)}" y="${VH - pad.b + 22}" fill="${muted}" font-size="13" text-anchor="middle">${esc(lab)}</text>`;
    });
    // y-axis caption
    const cy = pad.t + plotH / 2;
    svg += `<text x="20" y="${cy}" fill="${muted}" font-size="13" text-anchor="middle" transform="rotate(-90 20 ${cy})">${state.unit === "price_per_unit" ? "£ per standard unit" : "£ per metric tonne"}</text>`;
    // series: flat/linked line + a marker per real point
    series.forEach(s => {
      const line = s.linePts.slice().sort((a, b) => a.t - b.t)
        .map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
      svg += `<polyline points="${line}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linejoin="round"${s.dashed ? ' stroke-dasharray="6 4"' : ""}/>`;
      s.points.forEach(p => {
        const excl = p.n_excluded ? `, ${p.n_excluded} outlier${p.n_excluded > 1 ? "s" : ""} dropped` : "";
        const info = `${s.label} · ${p.date} · ${fmtMoney(p.v)} · ${p.n_used}/${p.n_obs} seller${p.n_obs > 1 ? "s" : ""}${excl}`;
        svg += `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5.5" fill="${s.color}" stroke="${panel}" stroke-width="2" data-info="${esc(info)}" data-oil="${s.oil}" data-ch="${s.ch}" data-date="${p.date}"><title>${esc(info)}</title></circle>`;
      });
    });
    host.innerHTML = svg + `</svg>`;
  }

  // ---- tap / hover a point for details (works on touch and desktop) -------
  function showTip(circle) {
    tip.textContent = circle.getAttribute("data-info");
    const hb = host.getBoundingClientRect(), cb = circle.getBoundingClientRect();
    let x = cb.left - hb.left + 12, y = cb.top - hb.top - 6;
    if (x + 230 > hb.width) x = Math.max(4, hb.width - 236);
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
  }
  host.addEventListener("click", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) { showTip(c); renderDetail(c.dataset.oil, c.dataset.ch, c.dataset.date); }
    else tip.style.opacity = 0;
  });

  // ---- click-through: full per-SKU-per-website breakdown ------------------
  const detail = document.getElementById("detail");
  function renderDetail(oil, ch, date) {
    const o = DATA.oils[oil]; if (!o) return;
    const pt = (o.channels[ch] || []).find(p => p.date === date);
    if (!pt || !pt.breakdown) return;
    const rows = pt.breakdown.map(b => {
      const flags = [];
      if (b.stale) flags.push(`carried from ${b.as_of.slice(5)}`);
      if (b.excluded) flags.push("outlier — excluded");
      const fl = flags.length ? ` <span class="fl">(${flags.join(" · ")})</span>` : "";
      return `<tr class="${b.excluded ? "ex" : ""}"><td>${b.source}</td><td>${b.product}${fl}</td>` +
             `<td>${fmtMoney(b.price_per_unit)}</td><td>${fmtMoney(b.price_per_tonne)}</td></tr>`;
    }).join("");
    detail.innerHTML =
      `<div class="dhead"><span class="dot" style="background:${o.color}"></span>` +
      `<b>${o.label}</b> &mdash; ${date} &middot; aggregate ${fmtMoney(pt.price_per_unit)}/unit ` +
      `(${pt.n_used} seller${pt.n_used > 1 ? "s" : ""})</div>` +
      `<table class="dtab"><tr><th>Website</th><th>Product (SKU)</th><th>£/unit</th><th>£/tonne</th></tr>${rows}</table>`;
    detail.style.display = "block";
  }
  host.addEventListener("mouseover", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) showTip(c);
  });
  host.addEventListener("mouseleave", () => { tip.style.opacity = 0; });

  // ---- banner + unit table ------------------------------------------------
  function updateBanner() {
    const b = document.getElementById("banner");
    const dates = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.values(o.channels || {}).forEach(pts => pts.forEach(p => dates.add(p.date))));
    const nd = dates.size;
    b.innerHTML = nd <= 1
      ? `Single snapshot so far (<b>${DATA.generated}</b>), drawn as a flat line from the previous day so every oil is visible. Each marker is the cross-seller mean after dropping anomalies beyond ${DATA.std_dev_threshold} SD. The line takes real shape as the daily job adds dates.`
      : `${nd} dates &middot; generated ${DATA.generated}. Points beyond ${DATA.std_dev_threshold} SD from the cross-seller mean are excluded.`;
  }

  function buildUnitTable() {
    const t = document.getElementById("unitTable");
    let html = "<tr><th>Oil</th><th>Standard unit</th><th>Basis</th><th>Note</th></tr>";
    for (const o of Object.values(DATA.oils)) {
      const sp = o.standard_pack;
      html += `<tr><td>${o.label}</td><td>${sp.value} ${sp.unit}</td><td>${o.basis === "mass" ? "by weight" : "by volume"}</td><td style="color:var(--muted)">${o.notes || ""}</td></tr>`;
    }
    t.innerHTML = html;
  }

  document.getElementById("foot").innerHTML =
    "UK prices only, one fixed pack size per oil, reliable/established sellers only. Aggregated across: " +
    "JJ Foodservice, Brakes (Sysco), Costco UK, Marfast, CK Fast Foods, Cater-Choice and the Foodomarket UK index. " +
    "Prices are the single pack price including any current discount (a reliable shop dropping price is the signal). " +
    "£/tonne is computed here using published oil densities. This is a movement proxy, not a trading price. " +
    "See <code>data/sources.md</code> and <code>config/products.json</code> for the exact products.";

  renderLegend(); renderChannels(); buildUnitTable(); updateBanner(); draw();
})();
</script>
</body>
</html>
