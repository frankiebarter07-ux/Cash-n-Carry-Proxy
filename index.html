<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Olleco — UK Cooking Oil Index</title>
<!-- The SQUARE mark for the tab: the wide logo gets letterboxed into a square
     favicon slot and reads as a stretched sliver. -->
<link rel="icon" href="assets/olleco-square.jpg">
<!-- Arial is an Olleco brand face and ships on every device. This page makes NO
     external requests at all: same on a locked-down network, works offline from a
     saved copy, and no CDN can break it. -->
<style>
  :root {
    /* Olleco: Cyprus #00433F, Rio Grande #CBD300, White. Light only -- the mark is
       drawn for light grounds and the identity is white-forward. */
    --cyprus:#00433F;
    --cyprus-700:#00332F;      /* deeper, for the tile gradient */
    --lime:#CBD300;
    --ink:#0B2E2B;             /* body text: Cyprus-derived, softer than black */
    --heading:#00433F;
    --muted:#5A736F;
    --dim:#7C918D;
    --bg:#EDF2F0;              /* tinted ground, so white panels lift off it */
    --panel:#FFFFFF;
    --panel2:#F5F9F7;          /* inset surfaces */
    --line:#DCE7E3;
    --grid:#E9F0ED;
    --up:#1E8449; --down:#C0392B;
    --on-cyprus:#FFFFFF;
    --up-on-cyprus:#7BE8A6; --down-on-cyprus:#FF8A80;
    --face: Arial, Helvetica, "Helvetica Neue", sans-serif;
    --r-lg:18px; --r-md:14px; --r-sm:10px; --r-pill:999px;
    --shadow: 0 1px 2px rgba(0,67,63,.05), 0 10px 30px rgba(0,67,63,.07);
    --shadow-sm: 0 1px 2px rgba(0,67,63,.06);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 var(--face); font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px 56px; }

  /* ---- masthead: white, with the lime as the brand's signature rule ---- */
  .masthead { background:var(--panel); border-bottom:4px solid var(--lime);
              box-shadow:var(--shadow-sm); margin-bottom:22px; }
  .masthead-in { max-width:1180px; margin:0 auto; padding:16px 20px;
                 display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:11px; text-decoration:none; }
  .brand img { height:30px; width:auto; display:none; }
  :root.logo-ok .brand img { display:inline; }
  :root.logo-ok .wordmark { display:none; }
  .wordmark { font-size:25px; font-weight:700; letter-spacing:-.02em;
              text-transform:lowercase; color:var(--cyprus); line-height:1; }
  .wordmark::after { content:"\2022"; color:var(--lime); margin-left:2px; }
  .vrule { width:1px; height:26px; background:var(--line); }
  .title { font-size:13px; font-weight:700; letter-spacing:0; color:var(--heading); }
  .meta { font-size:12px; color:var(--muted); letter-spacing:0; margin-left:auto; text-align:right; }
  /* One line. The max-width:62ch was forcing a wrap on every screen; the size now
     scales with the viewport so the sentence stays on a single line, and nowrap
     holds it there down to 640px. Below that it wraps -- 85 characters cannot fit
     across a phone at a readable size, and shrinking further would be worse. */
  .strapline { font-size:clamp(12.5px, 1.5vw, 17px); color:var(--heading);
               margin:2px 0 16px; font-weight:700; letter-spacing:-.005em; }
  @media (min-width:640px) { .strapline { white-space:nowrap; } }
  .fallback { font-size:11px; color:var(--dim); margin:0 0 14px; }
  .fallback a { color:var(--muted); }

  /* ---- quote tiles: Cyprus-filled, so the brand carries the headline ---- */
  .quotes { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:14px; margin:0 0 14px; }
  .q { background:linear-gradient(160deg,var(--cyprus) 0%,var(--cyprus-700) 100%);
       color:var(--on-cyprus); padding:18px 20px 16px; border-radius:var(--r-md);
       box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .q::after {                                   /* a lime edge, the brand's tell */
    content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--qc,var(--lime));
  }
  .q .name { font-size:12.5px;
             color:var(--lime); font-weight:700; }
  .q .px { font-size:34px; line-height:1.1; margin-top:6px; font-weight:700;
           letter-spacing:-.015em; }
  .q .chg { font-size:13px; margin-top:3px; font-weight:700; }
  .q .sub { font-size:11.5px; color:#A9C7C3; margin-top:9px; letter-spacing:0; }
  .q .up { color:var(--up-on-cyprus); } .q .down { color:var(--down-on-cyprus); }
  .q .flat { color:#A9C7C3; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--muted); }

  /* ---- panels ---- */
  .panel { background:var(--panel); padding:18px 20px 20px; margin-top:14px;
           border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .phead { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           font-size:14px; color:var(--heading); font-weight:700;
           border-bottom:1px solid var(--line); padding-bottom:11px; margin-bottom:14px; }
  .phead .spacer { margin-left:auto; }
  .seg { display:inline-flex; flex-wrap:wrap; background:var(--panel2);
         border:1px solid var(--line); border-radius:var(--r-pill); overflow:hidden; }
  .seg button { appearance:none; border:0; background:transparent; color:var(--muted);
                font:inherit; font-size:11px; font-weight:700; letter-spacing:0;
                padding:6px 14px; cursor:pointer; }
  .seg button:hover { color:var(--cyprus); }
  .seg button[aria-pressed="true"] { background:var(--cyprus); color:#fff; }
  [hidden] { display:none !important; }

  /* ---- chart ---- */
  .chart-wrap { position:relative; }
  #chartHost svg { width:100%; height:auto; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
          user-select:none; border:1px solid var(--line); background:var(--panel2);
          padding:6px 14px; font:inherit; font-size:11px; font-weight:700;
          color:var(--cyprus); border-radius:var(--r-pill); }
  .chip[aria-pressed="false"] { opacity:.4; }
  .chip .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
         background:var(--cyprus); color:#fff; padding:9px 12px; font-size:11px;
         line-height:1.5; max-width:270px; z-index:5; border-radius:var(--r-sm);
         box-shadow:0 8px 24px rgba(0,67,63,.22); }

  /* ---- tables ---- */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px;
       color:var(--muted); font-weight:700; padding:8px 12px 8px 0;
       border-bottom:2px solid var(--line); white-space:nowrap; }
  td { padding:9px 12px 9px 0; border-bottom:1px solid var(--grid); font-size:13.5px; }
  td.n { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700; }
  tr.ex td { opacity:.45; text-decoration:line-through; }
  .fl { color:var(--dim); font-size:11px; font-weight:400; }
  .scroll { overflow-x:auto; }

  .detail { display:none; margin-top:16px; }
  .dblock { background:var(--panel2); border-radius:var(--r-md); padding:14px 16px;
            margin-bottom:12px; }
  .dblock:last-child { margin-bottom:0; }
  .dhead { display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12px;
           font-weight:700; margin-bottom:10px;
           letter-spacing:0; color:var(--heading); }
  .dhead .dot { width:10px; height:10px; border-radius:50%; }
  .dclose { margin-left:auto; appearance:none; background:var(--panel); cursor:pointer;
            border:1px solid var(--line); color:var(--muted); font:inherit;
            font-size:10.5px; font-weight:700; letter-spacing:0;
            padding:4px 13px; border-radius:var(--r-pill); }
  .dclose:hover { color:var(--cyprus); border-color:var(--muted); }
  .subhead { font-size:13px;
             color:var(--heading); margin:18px 0 8px; font-weight:700; }
  .subhead:first-child { margin-top:0; }
  .sum { font-size:12.5px; color:var(--muted); margin:0 0 10px; }
  .none { font-size:12.5px; color:var(--dim); margin:0; }
  .hint { font-size:11px; color:var(--dim); margin:12px 0 0; }
  .foot { font-size:11.5px; color:var(--muted); line-height:1.7; margin-top:18px;
          padding-top:16px; border-top:2px solid var(--lime); }

  /* ---- subscribe ---- */
  .subscribe { background:linear-gradient(160deg,var(--cyprus) 0%,var(--cyprus-700) 100%);
               color:#fff; display:flex; gap:26px; align-items:center; flex-wrap:wrap;
               justify-content:space-between; }
  .subscribe .s-title { font-size:13px;
                        color:var(--lime); font-weight:700; }
  .subscribe .s-copy { font-size:15px; margin:6px 0 0; max-width:46ch; font-weight:700; }
  .s-form { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .s-form input { font:inherit; font-size:14px; padding:11px 16px; min-width:250px;
                  border:1px solid rgba(255,255,255,.28); border-radius:var(--r-pill);
                  background:rgba(255,255,255,.08); color:#fff; }
  .s-form input::placeholder { color:#8FB2AD; }
  .s-form input:focus { outline:2px solid var(--lime); outline-offset:1px;
                        background:rgba(255,255,255,.14); }
  .s-form button { font:inherit; font-size:12px; font-weight:700; letter-spacing:0; padding:12px 22px; cursor:pointer;
                   border:0; border-radius:var(--r-pill);
                   background:var(--lime); color:var(--cyprus); }
  .s-form button:hover { filter:brightness(1.07); }
  .s-note { font-size:12px; margin:10px 0 0; color:var(--lime); flex-basis:100%; }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-in">
    <a class="brand" href="./">
      <img src="assets/olleco-logo.png" alt="Olleco"
           onload="document.documentElement.classList.add('logo-ok')">
      <span class="wordmark" id="wordmark">olleco</span>
    </a>
    <span class="vrule"></span>
    <div class="title">UK Cooking Oil Index</div>
    <div class="meta" id="asof">&nbsp;</div>
  </div>
</div>

<div class="wrap">
  <!-- Plain HTML on purpose: if this page's JavaScript fails, a link drawn by that
       same JavaScript would be no use to the reader. -->
  <p class="fallback">JavaScript blocked? <a href="dashboard_static.html">Plain version</a></p>

  <p class="strapline">Daily updates on the collection price of Cooking Oils being sold via Cash and Carry</p>

  <div class="quotes" id="quotes"></div>

  <div class="panel">
    <div class="phead">
      <span>Index history</span>
      <span class="spacer"></span>
      <div class="seg" id="rangeSeg">
        <button data-v="1D">1D</button>
        <button data-v="7D">7D</button>
        <button data-v="30D">30D</button>
        <button data-v="6M">6M</button>
        <button data-v="YTD">YTD</button>
        <button data-v="5Y">5Y</button>
        <button data-v="ALL" aria-pressed="true">All</button>
      </div>
      <div class="seg" id="unitSeg">
        <button data-v="price_per_unit" aria-pressed="true">£/pack</button>
        <button data-v="price_per_tonne" aria-pressed="false">£/tonne</button>
      </div>
      <div class="seg" id="chanSeg" hidden></div>
    </div>
    <div class="chart-wrap">
      <div id="chartHost"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="none" id="histNote"></p>
    <div class="detail" id="detail"></div>
  </div>

  <div class="panel">
    <div class="phead"><span>Price changes</span><span class="spacer"></span>
      <span id="chgWindow"></span></div>
    <div id="changesBody"></div>
  </div>

  <div class="panel subscribe">
    <div>
      <div class="s-title">Receive market reports</div>
      <p class="s-copy">Get an email whenever a cash-and-carry moves a price, plus a weekly summary.</p>
    </div>
    <form class="s-form" id="subForm">
      <label for="subEmail" class="sr-only" style="position:absolute;left:-9999px">Email address</label>
      <input type="email" id="subEmail" placeholder="you@company.com"
             autocomplete="email" required>
      <button type="submit">Subscribe</button>
    </form>
    <p class="s-note" id="subNote"></p>
  </div>

  <p class="foot" id="foot">&nbsp;</p>
</div>

<script src="data/series.js"></script>
<script>
(function () {
  const DATA = window.OIL_SERIES;
  if (!DATA) {
    document.body.innerHTML = "<p style='padding:40px'>No data — run scripts/process.py</p>";
    return;
  }

  const CHANNEL_LABEL = { cash_carry: "Cash & carry", retail: "Retail" };
  const state = { unit: "price_per_unit", channel: "cash_carry",
                  range: "ALL", off: new Set() };

  // The most recent date anywhere in the data. Ranges are measured back from the
  // last session, not from today, so the view does not go blank if collection
  // pauses for a few days.
  function latestDate() {
    let latest = null;
    for (const o of Object.values(DATA.oils))
      for (const pts of Object.values(o.channels || {}))
        for (const p of pts) if (!latest || p.date > latest) latest = p.date;
    return latest;
  }

  // Inclusive lower bound for the selected range, or null for everything.
  function rangeStart() {
    const latest = latestDate();
    if (!latest || state.range === "ALL") return null;
    const d = new Date(latest + "T00:00:00Z");
    if (state.range === "YTD") return new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const back = { "1D": 1, "7D": 7, "30D": 30 }[state.range];
    if (back != null) { d.setUTCDate(d.getUTCDate() - back); return d; }
    if (state.range === "6M") { d.setUTCMonth(d.getUTCMonth() - 6); return d; }
    if (state.range === "5Y") { d.setUTCFullYear(d.getUTCFullYear() - 5); return d; }
    return null;
  }

  function inRange(pts) {
    const from = rangeStart();
    if (!from) return pts;
    const kept = pts.filter(p => new Date(p.date + "T00:00:00Z") >= from);
    // Never show an empty chart: if the window predates all data, fall back to the
    // single most recent point rather than a blank panel.
    return kept.length ? kept : pts.slice(-1);
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const money = v => "£" + v.toLocaleString("en-GB",
    { minimumFractionDigits: v < 1000 ? 2 : 0, maximumFractionDigits: v < 1000 ? 2 : 0 });
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // Signed everywhere, so the arrow and sign carry the meaning even where the colour
  // convention (a price RISE is bad for a buyer) reads backwards to a trader.
  const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + money(Math.abs(v)).replace("£", "£");
  const cls = d => d > 0 ? "up" : d < 0 ? "down" : "flat";
  // "bib"/"drum" as recorded -> "Bib"/"Drum", not shouted.
  const fmtPack = f => !f ? "" : f[0].toUpperCase() + f.slice(1).toLowerCase();
  // {value:12.5, unit:"kg"} -> "12.5 kg"  (trailing .0 dropped: 20 L, not 20.0 L)
  const packLabel = p => !p ? "" : `${Number(p.value)} ${p.unit}`;
  const arrow = d => d > 0 ? "▲" : d < 0 ? "▼" : "■";

  const activeChannels = () =>
    state.channel === "both" ? ["cash_carry", "retail"] : [state.channel];

  function buildSeries() {
    const out = [];
    for (const [oil, o] of Object.entries(DATA.oils)) {
      if (state.off.has(oil)) continue;
      for (const ch of activeChannels()) {
        const pts = inRange((o.channels && o.channels[ch]) || []);
        if (!pts.length) continue;
        const chart = o.chart || {};
        out.push({
          key: oil + "|" + ch, oil, ch, color: o.color,
          label: o.label + (state.channel === "both" ? " · " + CHANNEL_LABEL[ch] : ""),
          // An oil sold in a different pack does not share the others' price
          // range, so config/oils.json can put it on its own axis.
          secondary: chart.axis === "secondary",
          pack: o.standard_pack,
          dashed: chart.dashed || (ch === "retail" && state.channel === "both"),
          points: pts.map(p => ({
            date: p.date, t: Date.parse(p.date), v: p[state.unit],
            n_used: p.n_used, n_obs: p.n_obs, n_excluded: p.n_excluded,
          })),
        });
      }
    }
    return out;
  }

  // ---- quote strip: last price and the move that produced it ---------------
  function renderQuotes() {
    let html = "";
    for (const [oil, o] of Object.entries(DATA.oils)) {
      const all = (o.channels || {})[state.channel] || [];
      if (!all.length) continue;
      const pts = inRange(all);
      const last = pts[pts.length - 1], base = pts.length > 1 ? pts[0] : null;
      const d = base ? last[state.unit] - base[state.unit] : 0;
      const pct = base && base[state.unit] ? (d / base[state.unit]) * 100 : 0;
      const sp = o.standard_pack;
      const chg = base
        ? `<span class="${cls(d)}">${arrow(d)} ${signed(d)} (${d > 0 ? "+" : d < 0 ? "−" : ""}${Math.abs(pct).toFixed(2)}%)</span>`
        : `<span class="flat">■ no earlier session</span>`;
      html += `<div class="q" style="--qc:${o.color}">
        <div class="name">${esc(o.label)}</div>
        <div class="px num">${esc(money(last[state.unit]))}</div>
        <div class="chg">${chg}</div>
        <div class="sub">${sp.value} ${esc(sp.unit)}</div>
      </div>`;
    }
    $("quotes").innerHTML = html;
  }

  // ---- legend --------------------------------------------------------------
  function renderLegend() {
    const el = $("legend");
    el.innerHTML = "";
    for (const [oil, o] of Object.entries(DATA.oils)) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.setAttribute("aria-pressed", state.off.has(oil) ? "false" : "true");
      chip.innerHTML = `<span class="dot" style="background:${o.color}"></span>${esc(o.label)}`;
      chip.addEventListener("click", () => {
        state.off.has(oil) ? state.off.delete(oil) : state.off.add(oil);
        renderLegend(); draw();
      });
      el.appendChild(chip);
    }
  }

  $("rangeSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      $("rangeSeg").querySelectorAll("button")
        .forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      state.range = btn.dataset.v;
      renderQuotes(); draw();
    });
  });

  $("unitSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      $("unitSeg").querySelectorAll("button")
        .forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      state.unit = btn.dataset.v;
      renderQuotes(); draw();
    });
  });

  function renderChannels() {
    const present = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.keys(o.channels || {}).forEach(ch => present.add(ch)));
    const order = ["cash_carry", "retail"].filter(ch => present.has(ch));
    state.channel = order[0] || "cash_carry";
    const seg = $("chanSeg");
    if (order.length <= 1) { seg.hidden = true; return; }   // B2B only: nothing to switch
    seg.hidden = false;
    seg.innerHTML = "";
    [...order.map(ch => [ch, CHANNEL_LABEL[ch]]), ["both", "Both"]].forEach(([v, label], i) => {
      const b = document.createElement("button");
      b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        state.channel = v; renderQuotes(); draw();
      });
      seg.appendChild(b);
    });
  }

  // ---- chart (inline SVG from a fixed viewBox -- no canvas sizing) ---------
  const host = $("chartHost"), tip = $("tip");
  const VW = 1000, VH = 380, PAD = { l: 78, r: 22, t: 16, b: 40 };
  const AXIS_W = 66;            // width of the second axis column, outboard of the first
  const DAY = 86400000;

  function draw() {
    const series = buildSeries();
    const muted = css("--muted"), grid = css("--grid"), panel = css("--panel");
    const mono = css("--face") ||
      "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";

    // Never invent a point. A single observation is drawn as a single marker: a
    // flat line back to a fabricated "yesterday" reads as two days of data, which
    // is precisely the confusion this index exists to avoid.
    series.forEach(s => { s.linePts = s.points; });

    // Split by axis. An oil in a different pack (palm, a 12.5kg box) does not
    // share the 20L range, so it reads off its own scale. If nothing is left on
    // the main axis, those series take it over -- an empty inner axis beside a
    // full outer one helps nobody.
    let primary = series.filter(s => !s.secondary);
    let secondary = series.filter(s => s.secondary);
    if (!primary.length) { primary = secondary; secondary = []; }

    const pad = Object.assign({}, PAD, { l: PAD.l + (secondary.length ? AXIS_W : 0) });
    const plotW = VW - pad.l - pad.r, plotH = VH - pad.t - pad.b;

    const times = [];
    series.forEach(s => s.linePts.forEach(p => times.push(p.t)));
    const head = `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="${mono}">`;
    if (!times.length) {
      host.innerHTML = head + `<text x="${VW/2}" y="${VH/2}" fill="${muted}" font-size="13" text-anchor="middle">NO SERIES SELECTED</text></svg>`;
      return;
    }

    // One domain per axis, padded independently.
    function domain(group) {
      const vals = [];
      group.forEach(s => s.linePts.forEach(p => vals.push(p.v)));
      if (!vals.length) return null;
      let lo = Math.min(...vals), hi = Math.max(...vals);
      if (lo === hi) { lo *= 0.97; hi *= 1.03; }
      const vpad = (hi - lo) * 0.14;
      return [lo - vpad, hi + vpad];
    }
    const domP = domain(primary), domS = domain(secondary);

    let tmin = Math.min(...times), tmax = Math.max(...times);
    if (tmin === tmax) { tmin -= DAY; tmax += DAY; }
    const X = t => pad.l + plotW * (t - tmin) / (tmax - tmin);
    const yOn = (d, v) => pad.t + plotH * (1 - (v - d[0]) / (d[1] - d[0]));
    const Y = s => v => yOn(s.secondary && domS ? domS : domP, v);

    // Axis captions name the unit each scale is in, so it is never a guess
    // which line reads off which -- the whole point of a second axis.
    const unitOf = s => state.unit === "price_per_tonne" ? "£/tonne"
      : "£/" + (s.pack ? packLabel(s.pack) : "pack");

    let svg = head;
    for (let i = 0; i <= 5; i++) {
      const v = domP[0] + (domP[1] - domP[0]) * i / 5, y = yOn(domP, v).toFixed(1);
      svg += `<line x1="${pad.l}" y1="${y}" x2="${VW - pad.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
      svg += `<text x="${pad.l - 9}" y="${y}" fill="${muted}" font-size="11.5" text-anchor="end" dominant-baseline="middle">${esc(money(v))}</text>`;
    }
    svg += `<text x="${pad.l - 9}" y="${pad.t - 4}" fill="${muted}" font-size="10.5" text-anchor="end">${esc(unitOf(primary[0]))}</text>`;

    if (secondary.length && domS) {
      // Outboard of the main axis, tinted to its series and with its own ticks.
      // No gridlines: two sets of horizontal rules would be unreadable.
      const sx = pad.l - AXIS_W, tint = secondary[0].color;
      svg += `<line x1="${sx}" y1="${pad.t}" x2="${sx}" y2="${pad.t + plotH}" stroke="${tint}" stroke-width="1" opacity="0.45"/>`;
      for (let i = 0; i <= 5; i++) {
        const v = domS[0] + (domS[1] - domS[0]) * i / 5, y = yOn(domS, v).toFixed(1);
        svg += `<line x1="${sx}" y1="${y}" x2="${sx + 5}" y2="${y}" stroke="${tint}" stroke-width="1" opacity="0.7"/>`;
        svg += `<text x="${sx - 7}" y="${y}" fill="${tint}" font-size="11.5" text-anchor="end" dominant-baseline="middle">${esc(money(v))}</text>`;
      }
      svg += `<text x="${sx - 7}" y="${pad.t - 4}" fill="${tint}" font-size="10.5" text-anchor="end">${esc(unitOf(secondary[0]))}</text>`;
    }
    [...new Set(times)].sort((a, b) => a - b).forEach(t => {
      const lab = new Date(t).toLocaleDateString("en-GB",
        { day: "2-digit", month: "short" });
      svg += `<text x="${X(t).toFixed(1)}" y="${VH - pad.b + 20}" fill="${muted}" font-size="11" text-anchor="middle">${esc(lab)}</text>`;
    });
    series.forEach(s => {
      const y = Y(s);
      if (s.linePts.length > 1) {
        const line = s.linePts.slice().sort((a, b) => a.t - b.t)
          .map(p => `${X(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
        svg += `<polyline points="${line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="6 4"' : ""}/>`;
      }
      s.points.forEach(p => {
        const excl = p.n_excluded ? ` · ${p.n_excluded} excluded` : "";
        const info = `${s.label} · ${p.date} · ${money(p.v)} · ${p.n_used}/${p.n_obs} SELLERS${excl}`;
        // >=8px hit target per the dataviz mark spec, and a surface-coloured ring
        // so overlapping markers stay separable.
        const r = s.points.length === 1 ? 7 : 5;
        svg += `<circle cx="${X(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${r}" fill="${s.color}" stroke="${panel}" stroke-width="2" data-info="${esc(info)}" data-oil="${s.oil}" data-ch="${s.ch}" data-date="${p.date}"><title>${esc(info)}</title></circle>`;
      });
    });
    host.innerHTML = svg + "</svg>";
  }

  function showTip(c) {
    tip.textContent = c.getAttribute("data-info");
    const hb = host.getBoundingClientRect(), cb = c.getBoundingClientRect();
    let x = cb.left - hb.left + 12;
    if (x + 250 > hb.width) x = Math.max(4, hb.width - 256);
    tip.style.left = x + "px";
    tip.style.top = (cb.top - hb.top - 6) + "px";
    tip.style.opacity = 1;
  }
  host.addEventListener("click", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) { showTip(c); toggleDetail(c.dataset.oil, c.dataset.ch, c.dataset.date); }
    else tip.style.opacity = 0;
  });
  host.addEventListener("mouseover", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) showTip(c);
  });
  host.addEventListener("mouseleave", () => { tip.style.opacity = 0; });

  // ---- per-SKU constituents behind a point --------------------------------
  // Keyed by oil+channel so each oil can be open independently -- comparing the
  // two side by side is the point of the breakdown, and a single shared panel
  // made that impossible.
  const openDetails = new Map();

  function toggleDetail(oil, ch, date) {
    const k = oil + "|" + ch;
    if (openDetails.get(k) === date) openDetails.delete(k);
    else openDetails.set(k, date);
    renderDetails();
  }

  function renderDetails() {
    const el = $("detail");
    if (!openDetails.size) { el.innerHTML = ""; el.style.display = "none"; return; }
    // Render in the oils' own order, not the order they happened to be clicked.
    const html = Object.keys(DATA.oils)
      .flatMap(oil => activeChannels()
        .filter(ch => openDetails.has(oil + "|" + ch))
        .map(ch => detailBlock(oil, ch, openDetails.get(oil + "|" + ch))))
      .join("");
    el.innerHTML = html;
    el.style.display = html ? "block" : "none";
  }

  $("detail").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-close]");
    if (!b) return;
    openDetails.delete(b.getAttribute("data-close"));
    renderDetails();
  });

  function detailBlock(oil, ch, date) {
    const o = DATA.oils[oil]; if (!o) return "";
    const pt = (o.channels[ch] || []).find(p => p.date === date);
    if (!pt || !pt.breakdown) return "";
    const rows = pt.breakdown.map(b => {
      const flags = [];
      if (b.stale) flags.push(`carried ${b.as_of.slice(5)}`);
      if (b.lapsed) flags.push(`stopped reporting ${b.age_days}d`);
      if (b.excluded) flags.push("outlier");
      const fl = flags.length ? ` <span class="fl">${esc(flags.join(" · "))}</span>` : "";
      return `<tr class="${b.excluded || b.lapsed ? "ex" : ""}"><td>${esc(b.source)}</td>` +
             `<td>${esc(b.brand || "")}</td><td>${esc(fmtPack(b.format))}</td>` +
             `<td>${esc(b.product)}${fl}</td>` +
             `<td class="n">${esc(money(b.price_per_unit))}</td>` +
             `<td class="n">${esc(money(b.price_per_tonne))}</td></tr>`;
    }).join("");
    return `<div class="dblock">` +
      `<div class="dhead"><span class="dot" style="background:${o.color}"></span>` +
      `${esc(o.label)} · ${esc(date)} · ${esc(money(pt.price_per_unit))} · ${pt.n_used} sellers` +
      `<button class="dclose" data-close="${esc(oil + "|" + ch)}">close</button></div>` +
      `<div class="scroll"><table><tr><th>Seller</th><th>Brand</th><th>Pack</th>` +
      `<th>SKU</th><th>£/pack</th><th>£/tonne</th></tr>${rows}</table></div></div>`;
  }

  // ---- price changes -------------------------------------------------------
  function movesTable(moves) {
    if (!moves || !moves.length) return '<p class="none">No changes in this window.</p>';
    const rows = moves.map(m =>
      `<tr><td>${esc(m.source)}</td><td>${esc(m.oil)}</td><td>${esc(m.brand || "")}</td>` +
      `<td>${esc(fmtPack(m.format))}</td>` +
      `<td class="n">${esc(money(m.from))}</td><td class="n">${esc(money(m.to))}</td>` +
      `<td class="n ${cls(m.delta)}">${arrow(m.delta)} ${esc(signed(m.delta))} ` +
      `(${m.pct > 0 ? "+" : m.pct < 0 ? "−" : ""}${Math.abs(m.pct).toFixed(2)}%)</td></tr>`).join("");
    return `<div class="scroll"><table><tr><th>Seller</th><th>Oil</th><th>Brand</th>` +
           `<th>Pack</th><th>From</th><th>To</th><th>Change</th></tr>${rows}</table></div>`;
  }

  function movesSummary(summary) {
    const oils = Object.keys(summary || {});
    if (!oils.length) return "";
    return oils.map(oil => {
      const s = summary[oil];
      return `<p class="sum"><span class="${cls(s.avg_delta)}">${arrow(s.avg_delta)}</span> ` +
             `${esc(oil)} — ${s.n_skus_changed} SKU, avg ${esc(signed(s.avg_delta))} ` +
             `(${s.avg_pct > 0 ? "+" : s.avg_pct < 0 ? "−" : ""}${Math.abs(s.avg_pct).toFixed(2)}%), ` +
             `${s.n_up} up / ${s.n_down} down · ${esc(s.movers.join(", "))}</p>`;
    }).join("");
  }

  function renderChanges() {
    const ch = DATA.changes || {};
    $("chgWindow").textContent = (ch.week_from || "") + " → " + (ch.latest_date || "");
    $("changesBody").innerHTML =
      `<div class="subhead">Latest session · ${esc(ch.latest_date || "n/a")}</div>` +
      movesSummary(ch.today_summary) + movesTable(ch.today) +
      `<div class="subhead">Trailing 7 days</div>` +
      movesSummary(ch.week_summary) + movesTable(ch.week);
  }

  // ---- header + footer -----------------------------------------------------
  function renderMeta() {
    const ch = DATA.changes || {};
    const dates = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.values(o.channels || {}).forEach(pts => pts.forEach(p => dates.add(p.date))));
    const n = dates.size;
    const d = new Date((ch.latest_date || DATA.generated) + "T00:00:00Z");
    $("asof").textContent = "Updated " + d.toLocaleDateString("en-GB",
      { day: "numeric", month: "long", year: "numeric" });
    $("histNote").textContent = n > 1 ? "" :
      "One session recorded so far. The index adds a point per day — a trend needs " +
      "a few weeks. Nothing is drawn for days that were not collected.";
    $("foot").textContent =
      "All Unit prices are 20L drums or bibs, collection prices only";
  }

  // ---- subscribe -----------------------------------------------------------
  // A static page has no server, so nothing can be stored here. The form composes
  // an email instead: the address goes to a monitored mailbox, and whoever runs
  // the index adds it to the REPORT_TO secret. That secret -- NOT this repository
  // -- is the distribution list. See HANDOVER.md section 4b.
  const SUBSCRIBE_TO = "oilindex@olleco.co.uk";   // <-- must be a real monitored mailbox

  $("subForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const addr = $("subEmail").value.trim();
    if (!addr) return;
    const subject = encodeURIComponent("Cooking oil index - subscription request");
    const body = encodeURIComponent(
      "Please add this address to the cooking oil index distribution list:\n\n"
      + addr + "\n");
    window.location.href = `mailto:${SUBSCRIBE_TO}?subject=${subject}&body=${body}`;
    // Be explicit that the request is not complete until they send it -- a form
    // that says "thanks" while nothing has been submitted is worse than no form.
    $("subNote").textContent =
      "Almost there \u2014 your email app should be opening. Press send to complete the "
      + "request; nothing reaches us until you do. If nothing opened, email "
      + SUBSCRIBE_TO + " with the address you want added.";
    $("subEmail").value = "";
  });

  renderChannels(); renderQuotes(); renderLegend(); renderChanges(); renderMeta(); draw();
})();
</script>
</body>
</html>
