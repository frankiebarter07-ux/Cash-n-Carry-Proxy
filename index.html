<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UK Cooking Oil Index</title>
<style>
  /* Trading-screen style: dark by default, dense, figures in tabular numerals.
     Light palette kept behind the toggle, but dark is the intended look. */
  :root {
    /* Olleco palette: Cyprus #00433F, Rio Grande #CBD300, White.
       The dark ground is Cyprus taken down in value, so the whole screen sits in
       the brand's own hue rather than a generic black. */
    --bg:#00201D; --panel:#002E2A; --panel2:#00352F; --line:#0A4F49;
    --grid:#073B36; --ink:#EDF3F1; --muted:#8FB2AD; --dim:#77A29D;
    /* ------------------------------------------------------------------ *
     * OLLECO BRAND — replace --brand with the exact value from the brand
     * pack. Every accent on the page derives from it, so one edit rebrands
     * the whole thing. The value below is a PLACEHOLDER green chosen to sit
     * correctly against this palette; it is NOT Olleco's specified colour.
     * ------------------------------------------------------------------ */
    --brand:#CBD300;          /* Rio Grande */
    --on-brand:#00332F;       /* text sitting ON the brand colour */
    --lime:#CBD300;           /* the header rule, in both themes */
    --accent:var(--brand);
    /* Market convention, deliberately NOT brand colours -- these must read
       instantly, and both are held well clear of the lime accent in hue so a
       rise can never be mistaken for the brand highlight. */
    --up:#4ADE80; --down:#FF6B6B;
    /* A rounded geometric sans -- Avenir Next on Apple devices, Century Gothic on
       Windows. Deliberately NOT the -apple-system/Segoe stack, which is the default
       every untouched page uses. Figures get tabular-nums so columns still line up
       without resorting to a typewriter face. */
    --face: "Avenir Next", Avenir, "Futura", "Century Gothic", "URW Gothic",
            "Nunito Sans", "Trebuchet MS", sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#F5F7F4; --panel:#FFFFFF; --panel2:#FAFBF8; --line:#DBE3DF;
    --grid:#EAEFEC; --ink:#00433F; --muted:#4C6B67; --dim:#5F7B77;
    --brand:#00433F;          /* Cyprus reads as the accent on white */
    --on-brand:#FFFFFF; --lime:#CBD300; --accent:var(--brand);
    --up:#1E8449; --down:#C0392B;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:13.5px/1.5 var(--face); font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:0 16px 48px; }
  .num { font-variant-numeric:tabular-nums; }

  /* ---- top bar ---- */
  .topbar {
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    border-bottom:3px solid var(--lime); padding:14px 0 9px; margin-bottom:2px;
  }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .brand img { height:26px; width:auto; display:none; }        /* shown once it loads */
  .brand .wordmark { font-size:23px; font-weight:700; letter-spacing:-.02em;
                     text-transform:lowercase; color:var(--ink); line-height:1; }
  .brand .wordmark::after {           /* the lime mark, as a dot rather than a drawing */
    content:"•"; color:var(--lime); margin-left:2px; font-size:23px;
  }
  .brand .rule { width:1px; height:20px; background:var(--line); }
  .title { font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; }
  /* Two files so the mark reads correctly on either background. If the brand pack
     has only one, copy it to both names -- see assets/README.md. */
  .logo-dark { display:none; }
  :root[data-theme="light"] .logo-light { display:none !important; }
  :root[data-theme="light"] .logo-dark  { display:inline !important; }
  .meta {
    font-size:11px; color:var(--muted);
    letter-spacing:.05em; text-transform:uppercase; margin-right:auto;
  }
  .themebtn {
    font:inherit; font-size:11px; color:var(--muted); cursor:pointer;
    background:transparent; border:1px solid var(--line); padding:3px 8px; letter-spacing:.06em;
  }
  .fallback { font-size:11px; color:var(--dim); padding:6px 0 0; }
  .fallback a { color:var(--muted); }

  /* ---- quote strip ---- */
  .quotes { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:2px; margin:12px 0; }
  .q { background:var(--panel); border-left:3px solid var(--qc,var(--accent)); padding:12px 14px; }
  .q .name { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .q .px { font-size:30px; line-height:1.15; margin-top:3px; font-variant-numeric:tabular-nums; }
  .q .chg { font-size:13px; margin-top:1px; }
  .q .sub { font-size:10.5px; color:var(--dim); margin-top:6px; letter-spacing:.05em; text-transform:uppercase; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--muted); }

  /* ---- panels ---- */
  .panel { background:var(--panel); border:1px solid var(--line); padding:14px 16px 16px; margin-top:2px; }
  .phead {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--line); padding-bottom:9px; margin-bottom:12px;
  }
  .phead .spacer { margin-left:auto; }
  .seg { display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); }
  .seg button {
    appearance:none; border:0; border-right:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:11px; letter-spacing:.06em;
    padding:4px 10px; cursor:pointer; text-transform:uppercase;
  }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-brand); font-weight:600; }
  [hidden] { display:none !important; }

  /* ---- chart ---- */
  .chart-wrap { position:relative; }
  #chartHost svg { width:100%; height:auto; display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:2px; margin-top:10px; }
  .chip {
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    border:1px solid var(--line); background:var(--panel2); padding:4px 10px;
    font-size:11px; letter-spacing:.05em; color:var(--ink);
    text-transform:uppercase;
  }
  .chip[aria-pressed="false"] { opacity:.35; }
  .chip .dot { width:9px; height:9px; flex:0 0 auto; }
  .tip {
    position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--ink); color:var(--bg); padding:7px 9px; font-size:11px; line-height:1.5; max-width:260px; z-index:5;
  }

  /* ---- tables ---- */
  table { width:100%; border-collapse:collapse; }
  th {
    text-align:left; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); font-weight:600; padding:6px 10px 6px 0; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td { padding:6px 10px 6px 0; border-bottom:1px solid var(--grid); font-size:13px; }
  td.n { font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.ex td { opacity:.45; text-decoration:line-through; }
  .fl { color:var(--dim); font-size:11px; }
  .scroll { overflow-x:auto; }

  .detail { display:none; margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  .dhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px;
           margin-bottom:8px; text-transform:uppercase; letter-spacing:.06em; }
  .dhead .dot { width:9px; height:9px; }
  .subhead {
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
    margin:16px 0 6px; font-weight:600;
  }
  .subhead:first-child { margin-top:0; }
  .sum { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .none { font-size:12px; color:var(--dim); margin:0; }
  .foot {
    font-size:11px; color:var(--dim); line-height:1.7;
    letter-spacing:.03em; margin-top:14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="./">
      <img class="logo-light" src="assets/olleco-logo-white.png" alt="Olleco"
           onload="this.style.display='inline';document.getElementById('wordmark').style.display='none'">
      <img class="logo-dark" src="assets/olleco-logo.png" alt="Olleco"
           onload="this.style.display='inline';document.getElementById('wordmark').style.display='none'">
      <span class="wordmark" id="wordmark">olleco</span>
    </a>
    <span class="rule"></span>
    <div class="title">UK Cooking Oil Index</div>
    <div class="meta" id="asof">&nbsp;</div>
    <button class="themebtn" id="themeToggle">THEME</button>
  </div>
  <!-- Plain HTML on purpose: if this page's JavaScript fails, a link drawn by that
       same JavaScript would be no use to the reader. -->
  <p class="fallback">JavaScript blocked? <a href="dashboard_static.html">Plain version</a></p>

  <div class="quotes" id="quotes"></div>

  <div class="panel">
    <div class="phead">
      <span>Index history</span>
      <span class="spacer"></span>
      <div class="seg" id="rangeSeg">
        <button data-v="1D">1D</button>
        <button data-v="7D">7D</button>
        <button data-v="30D">30D</button>
        <button data-v="6M">6M</button>
        <button data-v="YTD">YTD</button>
        <button data-v="5Y">5Y</button>
        <button data-v="ALL" aria-pressed="true">All</button>
      </div>
      <div class="seg" id="unitSeg">
        <button data-v="price_per_unit" aria-pressed="true">£/pack</button>
        <button data-v="price_per_tonne" aria-pressed="false">£/tonne</button>
      </div>
      <div class="seg" id="chanSeg" hidden></div>
    </div>
    <div class="chart-wrap">
      <div id="chartHost"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <p class="none" id="histNote"></p>
    <div class="detail" id="detail"></div>
  </div>

  <div class="panel">
    <div class="phead"><span>Price changes</span><span class="spacer"></span>
      <span class="num" id="chgWindow"></span></div>
    <div id="changesBody"></div>
  </div>

  <p class="foot" id="foot">&nbsp;</p>
</div>

<script src="data/series.js"></script>
<script>
(function () {
  const DATA = window.OIL_SERIES;
  if (!DATA) {
    document.body.innerHTML = "<p style='padding:40px;font-family:monospace'>NO DATA — run scripts/process.py</p>";
    return;
  }

  const CHANNEL_LABEL = { cash_carry: "Cash & carry", retail: "Retail" };
  const state = { unit: "price_per_unit", channel: "cash_carry",
                  range: "ALL", off: new Set() };

  // The most recent date anywhere in the data. Ranges are measured back from the
  // last session, not from today, so the view does not go blank if collection
  // pauses for a few days.
  function latestDate() {
    let latest = null;
    for (const o of Object.values(DATA.oils))
      for (const pts of Object.values(o.channels || {}))
        for (const p of pts) if (!latest || p.date > latest) latest = p.date;
    return latest;
  }

  // Inclusive lower bound for the selected range, or null for everything.
  function rangeStart() {
    const latest = latestDate();
    if (!latest || state.range === "ALL") return null;
    const d = new Date(latest + "T00:00:00Z");
    if (state.range === "YTD") return new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const back = { "1D": 1, "7D": 7, "30D": 30 }[state.range];
    if (back != null) { d.setUTCDate(d.getUTCDate() - back); return d; }
    if (state.range === "6M") { d.setUTCMonth(d.getUTCMonth() - 6); return d; }
    if (state.range === "5Y") { d.setUTCFullYear(d.getUTCFullYear() - 5); return d; }
    return null;
  }

  function inRange(pts) {
    const from = rangeStart();
    if (!from) return pts;
    const kept = pts.filter(p => new Date(p.date + "T00:00:00Z") >= from);
    // Never show an empty chart: if the window predates all data, fall back to the
    // single most recent point rather than a blank panel.
    return kept.length ? kept : pts.slice(-1);
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const money = v => "£" + v.toLocaleString("en-GB",
    { minimumFractionDigits: v < 1000 ? 2 : 0, maximumFractionDigits: v < 1000 ? 2 : 0 });
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // Signed everywhere, so the arrow and sign carry the meaning even where the colour
  // convention (a price RISE is bad for a buyer) reads backwards to a trader.
  const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + money(Math.abs(v)).replace("£", "£");
  const cls = d => d > 0 ? "up" : d < 0 ? "down" : "flat";
  const arrow = d => d > 0 ? "▲" : d < 0 ? "▼" : "■";

  $("themeToggle").addEventListener("click", () => {
    const r = document.documentElement;
    const cur = r.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "dark");
    r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    draw();
  });

  const activeChannels = () =>
    state.channel === "both" ? ["cash_carry", "retail"] : [state.channel];

  function buildSeries() {
    const out = [];
    for (const [oil, o] of Object.entries(DATA.oils)) {
      if (state.off.has(oil)) continue;
      for (const ch of activeChannels()) {
        const pts = inRange((o.channels && o.channels[ch]) || []);
        if (!pts.length) continue;
        out.push({
          key: oil + "|" + ch, oil, ch, color: o.color,
          label: o.label + (state.channel === "both" ? " · " + CHANNEL_LABEL[ch] : ""),
          dashed: ch === "retail" && state.channel === "both",
          points: pts.map(p => ({
            date: p.date, t: Date.parse(p.date), v: p[state.unit],
            n_used: p.n_used, n_obs: p.n_obs, n_excluded: p.n_excluded,
          })),
        });
      }
    }
    return out;
  }

  // ---- quote strip: last price and the move that produced it ---------------
  function renderQuotes() {
    let html = "";
    for (const [oil, o] of Object.entries(DATA.oils)) {
      const all = (o.channels || {})[state.channel] || [];
      if (!all.length) continue;
      const pts = inRange(all);
      const last = pts[pts.length - 1], base = pts.length > 1 ? pts[0] : null;
      const d = base ? last[state.unit] - base[state.unit] : 0;
      const pct = base && base[state.unit] ? (d / base[state.unit]) * 100 : 0;
      const sp = o.standard_pack;
      const chg = base
        ? `<span class="${cls(d)}">${arrow(d)} ${signed(d)} (${d > 0 ? "+" : d < 0 ? "−" : ""}${Math.abs(pct).toFixed(2)}%)</span>`
        : `<span class="flat">■ no earlier session</span>`;
      const since = base
        ? `vs ${new Date(base.date + "T00:00:00Z").toLocaleDateString("en-GB",
             { day: "2-digit", month: "short" })}`
        : "no comparison";
      html += `<div class="q" style="--qc:${o.color}">
        <div class="name">${esc(o.label)}</div>
        <div class="px num">${esc(money(last[state.unit]))}</div>
        <div class="chg">${chg}</div>
        <div class="sub">${sp.value}${esc(sp.unit)} · ${last.n_used} sellers · ${esc(since)}</div>
      </div>`;
    }
    $("quotes").innerHTML = html;
  }

  // ---- legend --------------------------------------------------------------
  function renderLegend() {
    const el = $("legend");
    el.innerHTML = "";
    for (const [oil, o] of Object.entries(DATA.oils)) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.setAttribute("aria-pressed", state.off.has(oil) ? "false" : "true");
      chip.innerHTML = `<span class="dot" style="background:${o.color}"></span>${esc(o.label)}`;
      chip.addEventListener("click", () => {
        state.off.has(oil) ? state.off.delete(oil) : state.off.add(oil);
        renderLegend(); draw();
      });
      el.appendChild(chip);
    }
  }

  $("rangeSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      $("rangeSeg").querySelectorAll("button")
        .forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      state.range = btn.dataset.v;
      renderQuotes(); draw();
    });
  });

  $("unitSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      $("unitSeg").querySelectorAll("button")
        .forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      state.unit = btn.dataset.v;
      renderQuotes(); draw();
    });
  });

  function renderChannels() {
    const present = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.keys(o.channels || {}).forEach(ch => present.add(ch)));
    const order = ["cash_carry", "retail"].filter(ch => present.has(ch));
    state.channel = order[0] || "cash_carry";
    const seg = $("chanSeg");
    if (order.length <= 1) { seg.hidden = true; return; }   // B2B only: nothing to switch
    seg.hidden = false;
    seg.innerHTML = "";
    [...order.map(ch => [ch, CHANNEL_LABEL[ch]]), ["both", "Both"]].forEach(([v, label], i) => {
      const b = document.createElement("button");
      b.dataset.v = v; b.textContent = label;
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        state.channel = v; renderQuotes(); draw();
      });
      seg.appendChild(b);
    });
  }

  // ---- chart (inline SVG from a fixed viewBox -- no canvas sizing) ---------
  const host = $("chartHost"), tip = $("tip");
  const VW = 1000, VH = 380, pad = { l: 78, r: 22, t: 16, b: 40 };
  const plotW = VW - pad.l - pad.r, plotH = VH - pad.t - pad.b, DAY = 86400000;

  function draw() {
    const series = buildSeries();
    const muted = css("--muted"), grid = css("--grid"), panel = css("--panel");
    const mono = css("--face") ||
      "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";

    // Never invent a point. A single observation is drawn as a single marker: a
    // flat line back to a fabricated "yesterday" reads as two days of data, which
    // is precisely the confusion this index exists to avoid.
    series.forEach(s => { s.linePts = s.points; });

    const vals = [], times = [];
    series.forEach(s => s.linePts.forEach(p => { vals.push(p.v); times.push(p.t); }));
    const head = `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="${mono}">`;
    if (!vals.length) {
      host.innerHTML = head + `<text x="${VW/2}" y="${VH/2}" fill="${muted}" font-size="13" text-anchor="middle">NO SERIES SELECTED</text></svg>`;
      return;
    }

    let vmin = Math.min(...vals), vmax = Math.max(...vals);
    if (vmin === vmax) { vmin *= 0.97; vmax *= 1.03; }
    const vpad = (vmax - vmin) * 0.14; vmin -= vpad; vmax += vpad;
    let tmin = Math.min(...times), tmax = Math.max(...times);
    if (tmin === tmax) { tmin -= DAY; tmax += DAY; }
    const X = t => pad.l + plotW * (t - tmin) / (tmax - tmin);
    const Y = v => pad.t + plotH * (1 - (v - vmin) / (vmax - vmin));

    let svg = head;
    for (let i = 0; i <= 5; i++) {
      const v = vmin + (vmax - vmin) * i / 5, y = Y(v).toFixed(1);
      svg += `<line x1="${pad.l}" y1="${y}" x2="${VW - pad.r}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
      svg += `<text x="${pad.l - 9}" y="${y}" fill="${muted}" font-size="11.5" text-anchor="end" dominant-baseline="middle">${esc(money(v))}</text>`;
    }
    [...new Set(times)].sort((a, b) => a - b).forEach(t => {
      const lab = new Date(t).toLocaleDateString("en-GB",
        { day: "2-digit", month: "short" }).toUpperCase();
      svg += `<text x="${X(t).toFixed(1)}" y="${VH - pad.b + 20}" fill="${muted}" font-size="11" text-anchor="middle">${esc(lab)}</text>`;
    });
    series.forEach(s => {
      if (s.linePts.length > 1) {
        const line = s.linePts.slice().sort((a, b) => a.t - b.t)
          .map(p => `${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
        svg += `<polyline points="${line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"${s.dashed ? ' stroke-dasharray="6 4"' : ""}/>`;
      }
      s.points.forEach(p => {
        const excl = p.n_excluded ? ` · ${p.n_excluded} EXCL` : "";
        const info = `${s.label.toUpperCase()} · ${p.date} · ${money(p.v)} · ${p.n_used}/${p.n_obs} SELLERS${excl}`;
        const r = s.points.length === 1 ? 6 : 4.5;
        svg += `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${r}" fill="${s.color}" stroke="${panel}" stroke-width="1.5" data-info="${esc(info)}" data-oil="${s.oil}" data-ch="${s.ch}" data-date="${p.date}"><title>${esc(info)}</title></circle>`;
      });
    });
    host.innerHTML = svg + "</svg>";
  }

  function showTip(c) {
    tip.textContent = c.getAttribute("data-info");
    const hb = host.getBoundingClientRect(), cb = c.getBoundingClientRect();
    let x = cb.left - hb.left + 12;
    if (x + 250 > hb.width) x = Math.max(4, hb.width - 256);
    tip.style.left = x + "px";
    tip.style.top = (cb.top - hb.top - 6) + "px";
    tip.style.opacity = 1;
  }
  host.addEventListener("click", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) { showTip(c); renderDetail(c.dataset.oil, c.dataset.ch, c.dataset.date); }
    else tip.style.opacity = 0;
  });
  host.addEventListener("mouseover", ev => {
    const c = ev.target.closest("circle[data-info]");
    if (c) showTip(c);
  });
  host.addEventListener("mouseleave", () => { tip.style.opacity = 0; });

  // ---- per-SKU constituents behind a point --------------------------------
  function renderDetail(oil, ch, date) {
    const o = DATA.oils[oil]; if (!o) return;
    const pt = (o.channels[ch] || []).find(p => p.date === date);
    if (!pt || !pt.breakdown) return;
    const rows = pt.breakdown.map(b => {
      const flags = [];
      if (b.stale) flags.push(`carried ${b.as_of.slice(5)}`);
      if (b.lapsed) flags.push(`stopped reporting ${b.age_days}d`);
      if (b.excluded) flags.push("outlier");
      const fl = flags.length ? ` <span class="fl">${esc(flags.join(" · "))}</span>` : "";
      return `<tr class="${b.excluded || b.lapsed ? "ex" : ""}"><td>${esc(b.source)}</td>` +
             `<td>${esc(b.brand || "")}</td><td>${esc((b.format || "").toUpperCase())}</td>` +
             `<td>${esc(b.product)}${fl}</td>` +
             `<td class="n">${esc(money(b.price_per_unit))}</td>` +
             `<td class="n">${esc(money(b.price_per_tonne))}</td></tr>`;
    }).join("");
    $("detail").innerHTML =
      `<div class="dhead"><span class="dot" style="background:${o.color}"></span>` +
      `${esc(o.label)} · ${esc(date)} · ${esc(money(pt.price_per_unit))} · ${pt.n_used} sellers</div>` +
      `<div class="scroll"><table><tr><th>Seller</th><th>Brand</th><th>Pack</th>` +
      `<th>SKU</th><th>£/pack</th><th>£/tonne</th></tr>${rows}</table></div>`;
    $("detail").style.display = "block";
  }

  // ---- price changes -------------------------------------------------------
  function movesTable(moves) {
    if (!moves || !moves.length) return '<p class="none">No changes in this window.</p>';
    const rows = moves.map(m =>
      `<tr><td>${esc(m.source)}</td><td>${esc(m.oil)}</td><td>${esc(m.brand || "")}</td>` +
      `<td>${esc((m.format || "").toUpperCase())}</td>` +
      `<td class="n">${esc(money(m.from))}</td><td class="n">${esc(money(m.to))}</td>` +
      `<td class="n ${cls(m.delta)}">${arrow(m.delta)} ${esc(signed(m.delta))} ` +
      `(${m.pct > 0 ? "+" : m.pct < 0 ? "−" : ""}${Math.abs(m.pct).toFixed(2)}%)</td></tr>`).join("");
    return `<div class="scroll"><table><tr><th>Seller</th><th>Oil</th><th>Brand</th>` +
           `<th>Pack</th><th>From</th><th>To</th><th>Change</th></tr>${rows}</table></div>`;
  }

  function movesSummary(summary) {
    const oils = Object.keys(summary || {});
    if (!oils.length) return "";
    return oils.map(oil => {
      const s = summary[oil];
      return `<p class="sum"><span class="${cls(s.avg_delta)}">${arrow(s.avg_delta)}</span> ` +
             `${esc(oil)} — ${s.n_skus_changed} SKU, avg ${esc(signed(s.avg_delta))} ` +
             `(${s.avg_pct > 0 ? "+" : s.avg_pct < 0 ? "−" : ""}${Math.abs(s.avg_pct).toFixed(2)}%), ` +
             `${s.n_up} up / ${s.n_down} down · ${esc(s.movers.join(", "))}</p>`;
    }).join("");
  }

  function renderChanges() {
    const ch = DATA.changes || {};
    $("chgWindow").textContent = (ch.week_from || "") + " → " + (ch.latest_date || "");
    $("changesBody").innerHTML =
      `<div class="subhead">Latest session · ${esc(ch.latest_date || "n/a")}</div>` +
      movesSummary(ch.today_summary) + movesTable(ch.today) +
      `<div class="subhead">Trailing 7 days</div>` +
      movesSummary(ch.week_summary) + movesTable(ch.week);
  }

  // ---- header + footer -----------------------------------------------------
  function renderMeta() {
    const dates = new Set();
    Object.values(DATA.oils).forEach(o =>
      Object.values(o.channels || {}).forEach(pts => pts.forEach(p => dates.add(p.date))));
    const n = dates.size;
    $("asof").textContent =
      `Cash & carry · collection · as of ${DATA.generated} · ${n} session${n === 1 ? "" : "s"}`;
    $("histNote").textContent = n > 1 ? "" :
      "One session recorded so far. The index adds a point per day — a trend needs " +
      "a few weeks. Nothing is drawn for days that were not collected.";
    $("foot").textContent =
      "All Unit prices are 20L drums or bibs, collection prices only";
  }

  renderChannels(); renderQuotes(); renderLegend(); renderChanges(); renderMeta(); draw();
})();
</script>
</body>
</html>
